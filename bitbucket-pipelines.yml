# Bitbucket Pipelines for the Fiskl help site.
#
# The build step works as soon as this lands. The two deploy steps need a
# one-time setup first - see doc/infrastructure.md:
#
#   1. Repository settings -> OpenID Connect. Copy the identity provider URL and
#      the audience.
#   2. Create the IAM OIDC identity provider in each AWS account, and put the
#      audience plus the repository/environment UUIDs into
#      infra/environments.json.
#   3. Set ciDeployRole: true for that environment and run
#      scripts/infra.sh <env> deploy. The role ARN is a stack output.
#   4. Create the "test" and "production" deployment environments here, each
#      holding that ARN as the variable AWS_DEPLOY_ROLE_ARN. Restrict
#      "production" to the main branch and give it a required approver - that is
#      where the "prod only from main" guarantee lives, because Bitbucket's OIDC
#      subject is UUID-based and cannot express a branch in the IAM trust policy.
#
# Deliberately no AWS access keys. Long-lived static credentials in a CI system
# are exactly what OIDC exists to remove: the pipeline presents a short-lived
# token, AWS trusts it, and nothing secret is ever stored.
#
# Both deploys are manual on purpose. Publishing is a decision, not a side
# effect of a merge.

image: node:24

definitions:
  caches:
    # pnpm's content-addressed store. Caching node_modules directly does not
    # work with pnpm: it is a tree of symlinks into this store.
    pnpm-store: /root/.local/share/pnpm/store

  steps:
    - step: &build
        name: Build and check
        caches: [pnpm-store]
        script:
          - corepack enable
          - pnpm install --frozen-lockfile
          - pnpm run build
          # The edge function's rewrite rule and the layout Docusaurus emits
          # have to agree, or individual routes 403 while the homepage keeps
          # working. Running it here means a Docusaurus upgrade that changes the
          # output shape fails on the pull request rather than after a deploy.
          - node infra/functions/viewer-request.test.js
          - cd infra && npm install --no-audit --no-fund && npx tsc --noEmit
          - FISKL_BASIC_AUTH_B64="$(printf 'ci:synthcheck' | base64)" npx cdk synth FisklHelp-test -c env=test --output cdk.out/ci
          - npx cdk synth FisklHelp-prod -c env=prod --output cdk.out/ci-prod

pipelines:
  pull-requests:
    '**':
      - step: *build

  branches:
    main:
      - step: *build
      - step:
          name: Deploy to production
          trigger: manual
          oidc: true
          deployment: production
          caches: [pnpm-store]
          script:
            - apt-get update -qq && apt-get install -y -qq unzip >/dev/null
            - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/aws.zip
            - unzip -q /tmp/aws.zip -d /tmp && /tmp/aws/install
            - corepack enable
            - export AWS_REGION=us-east-1
            - export AWS_ROLE_ARN=$AWS_DEPLOY_ROLE_ARN
            - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
            - echo "$BITBUCKET_STEP_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
            # deploy.sh asserts which AWS account it landed in before touching
            # anything, so a misconfigured role ARN fails here rather than
            # publishing to the wrong place.
            - ./scripts/deploy.sh prod
            - ./scripts/verify.sh prod

  custom:
    deploy-test:
      - variables:
          - name: CONFIRM
            default: "no"
            description: "Type yes to publish this branch to test-help.fiskl.com"
      - step:
          name: Deploy to test
          oidc: true
          deployment: test
          caches: [pnpm-store]
          script:
            - '[ "$CONFIRM" = "yes" ] || { echo "Not confirmed - nothing was deployed."; exit 1; }'
            - apt-get update -qq && apt-get install -y -qq unzip >/dev/null
            - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/aws.zip
            - unzip -q /tmp/aws.zip -d /tmp && /tmp/aws/install
            - corepack enable
            - export AWS_REGION=us-east-1
            - export AWS_ROLE_ARN=$AWS_DEPLOY_ROLE_ARN
            - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
            - echo "$BITBUCKET_STEP_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
            - ./scripts/deploy.sh test
            - ./scripts/verify.sh test
