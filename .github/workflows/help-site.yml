# CI for the Fiskl help site.
#
# NOT ACTIVE YET. Three things must exist before the deploy jobs will run:
#
#   1. An IAM OIDC identity provider in each AWS account, for
#      token.actions.githubusercontent.com. One command per account -
#      docs/RUNBOOK.md has it.
#   2. `githubOidcRole: true` for that environment in infra/environments.json,
#      then `scripts/infra.sh <env> deploy`. That creates the role and prints
#      its ARN.
#   3. A GitHub Environment ("test" and "production") holding that ARN as the
#      variable AWS_DEPLOY_ROLE_ARN. Give "production" a required reviewer -
#      that approval gate is this workflow's equivalent of a manual trigger.
#
# Until then, deploys run from a laptop with scripts/deploy.sh. The build job
# below is useful on its own and works today.
#
# Deliberately no AWS access keys. Long-lived static credentials in a CI system
# are exactly what OIDC exists to remove: the workflow presents a short-lived
# token, AWS trusts it, and nothing secret is ever stored. Retrofitting this
# later means reissuing everything.

name: Help site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_to_test:
        description: 'Publish this branch to the test help site'
        type: boolean
        default: false

# Least privilege by default. The deploy jobs add id-token: write themselves.
permissions:
  contents: read

concurrency:
  group: help-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The edge function's rewrite rule and the layout Docusaurus emits have
      # to agree or individual routes 403 while the homepage keeps working.
      # Checking it here means a Docusaurus upgrade that changes the output
      # shape fails on the pull request rather than after a deploy.
      - name: Check every route against the edge function
        run: node infra/functions/viewer-request.test.js
      - name: Check the infrastructure still synthesises
        working-directory: infra
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          FISKL_BASIC_AUTH_B64="$(printf 'ci:synthcheck' | base64)" \
            npx cdk synth FisklHelp-test -c env=test --output cdk.out/ci >/dev/null
          npx cdk synth FisklHelp-prod -c env=prod --output cdk.out/ci-prod >/dev/null

  deploy-test:
    name: Deploy to test
    # Any branch: reviewing an unmerged branch is what the test site is for.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_test
    needs: build
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # deploy.sh asserts the account it landed in before it touches anything,
      # so a misconfigured role ARN fails here rather than publishing a draft
      # somewhere unintended.
      - run: ./scripts/deploy.sh test
      - run: ./scripts/verify.sh test

  deploy-prod:
    name: Deploy to production
    # Publishing is a decision, not a side effect of a merge. The gate is the
    # "production" GitHub Environment: give it a required reviewer and this job
    # waits for approval. The OIDC trust policy independently refuses to issue
    # production credentials to any ref other than main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: ./scripts/deploy.sh prod
      - run: ./scripts/verify.sh prod
